[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-flow"
version = "0.1.0a1"
description = "Textualize-based TUI for cc-liquid portfolio rebalancing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "cc-liquid contributors"}
]
keywords = [
    "crypto",
    "trading",
    "hyperliquid",
    "portfolio",
    "rebalancing",
    "tui",
    "textual"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core dependencies
    "pydantic>=2.0,<3.0",           # Data validation and settings management
    "textual>=1.0.0",               # Terminal User Interface framework

    # Data processing
    "polars>=0.19.0",               # Fast dataframe operations

    # Exchange integration
    "hyperliquid-python-sdk>=0.7.0", # Hyperliquid exchange API
    "eth-account>=0.10.0",          # Wallet signing

    # UI and display
    "rich>=13.0.0",                 # Terminal formatting and display

    # Configuration
    "pyyaml>=6.0",                  # YAML config file parsing
    "python-dotenv>=1.0.0",         # Environment variable loading

    # Data sources
    "crowdcent-challenge>=0.1.0",   # CrowdCent API client

    # Logging
    "loguru>=0.7.0",                # Structured logging

    # Utilities
    "python-dateutil>=2.8.0",       # Date utilities
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",

    # Linting and formatting
    "ruff>=0.1.0",

    # Type checking
    "mypy>=1.5.0",

    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
]

[project.scripts]
cc-flow = "cc_flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip() without an explicit strict= parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["ARG001", "ARG002"]  # Allow unused arguments in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = [
    "hyperliquid.*",
    "crowdcent_challenge.*",
    "polars.*",
]
ignore_missing_imports = true
