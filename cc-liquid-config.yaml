is_testnet: false
active_profile: default
profiles:
  default:
    owner: '0x1234567890abcdef1234567890abcdef12345678'
    vault: null
    signer_env: HYPERLIQUID_PRIVATE_KEY

data:
  source: local
  path: predictions.parquet
  date_column: release_date
  asset_id_column: id
  prediction_column: pred_30d

portfolio:
  weighting_method: hrp_lw
  hrp_lookback_days: 60
  num_long: 25
  num_short: 25
  target_leverage: 2
  rank_power: 0.0
  mhrp_ewma_lambda: 0.97       # decay factor — tune via optimizer
  mhrp_vol_target: null        # e.g. 0.15 for 15% annualised vol target; null = off
  mhrp_annual_factor: 365      # 365 crypto / 252 equities
  stop_loss:
    sides: short_only
    pct: 0.2
    slippage: 0.07
  rebalancing:
    mode: rolling
    every_n_days: 30
    at_time: '18:05'
    rolling_days: 30
    seed_full: true

execution:
  order_type: limit
  time_in_force: Gtc
  limit_price_offset: 0.0
